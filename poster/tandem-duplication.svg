<line x1="294.0" y1="712.0" x2="294.0" y2="719.0" stroke="#5f6368" stroke-width="1.5" stroke-linecap="butt"/>
<text x="294.0" y="739.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="middle">4</text>
