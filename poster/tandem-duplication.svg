<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="1600" height="960" role="img" aria-label="A tandem duplication in Parallax output: the read passes through the duplicated unit twice, the chain joins the passes with one backward reference jump, and the read is reported as two records adjacent on the read that overlap on the reference by the unit length.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1600.0" height="960.0" fill="#ffffff"/>
<text x="60.0" y="66.0" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">A tandem duplication: two records that overlap on the reference</text>
<text x="60.0" y="100.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">The read passes through the duplicated unit twice. The chain joins the passes with one backward jump,</text>
<text x="60.0" y="124.0" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">and the jump starts a new record, so the two records overlap on the reference by the unit length.</text>
<rect x="130.0" y="196.0" width="656.0" height="504.0" fill="#f6f8fb"/>
<rect x="130.0" y="322.0" width="656.0" height="252.0" fill="#fff1cc"/>
<text x="142.0" y="346.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#8a6d1f" text-anchor="start">duplicated unit B (6 kb)</text>
<text transform="translate(44 448.0) rotate(-90)" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#5f6368" text-anchor="middle">chr7 reference position</text>
