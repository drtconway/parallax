<text x="786.0" y="739.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="middle">16 kb</text>
<text x="458.0" y="764.0" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="middle">read position</text>
