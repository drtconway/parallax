<text x="171.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="middle">A</text>
<rect x="213.0" y="782.0" width="244.0" height="24.0" fill="#fff1cc" stroke="#c9ced6" stroke-width="1"/>
<text x="335.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="middle">B</text>
<rect x="459.0" y="782.0" width="244.0" height="24.0" fill="#fff1cc" stroke="#c9ced6" stroke-width="1"/>
<text x="581.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="middle">B</text>
<rect x="705.0" y="782.0" width="80.0" height="24.0" fill="#e8edf3" stroke="#c9ced6" stroke-width="1"/>
<text x="745.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="middle">C</text>
<text x="118.0" y="800.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="end">read</text>
<line x1="170.9" y1="617.2" x2="179.3" y2="606.4" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="211.9" y1="575.2" x2="228.5" y2="556.0" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="261.1" y1="524.8" x2="277.7" y2="505.6" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="310.3" y1="474.4" x2="326.9" y2="455.2" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="359.5" y1="424.0" x2="376.1" y2="404.8" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="408.7" y1="373.6" x2="421.2" y2="358.6" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="494.8" y1="537.4" x2="507.3" y2="522.4" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="539.9" y1="491.2" x2="556.5" y2="472.0" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="589.1" y1="440.8" x2="605.7" y2="421.6" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="638.3" y1="390.4" x2="654.9" y2="371.2" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="687.5" y1="340.0" x2="704.1" y2="320.8" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="736.7" y1="289.6" x2="745.1" y2="278.8" stroke="#333333" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="452.8" y1="336.4" x2="464.2" y2="557.6" stroke="#333333" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="299.8" y="535.6" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#222222" text-anchor="start">backward jump of D:</text>
<text x="299.8" y="555.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#222222" text-anchor="start">−(35 + log<tspan dy="4.5" font-size="10.5">2</tspan><tspan dy="-4.5">(1 + D))</tspan></text>
<text x="299.8" y="576.1" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#222222" text-anchor="start">= −47.6 bits</text>
<text x="605.6" y="607.6" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#7b4fa0" text-anchor="start">second copy earns</text>
<text x="605.6" y="627.9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="normal" fill="#7b4fa0" text-anchor="start">+2 per base: +12,000 bits</text>
<line x1="142.3" y1="645.4" x2="166.9" y2="620.2" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="183.3" y1="603.4" x2="207.9" y2="578.2" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="232.5" y1="553.0" x2="257.1" y2="527.8" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="281.7" y1="502.6" x2="306.3" y2="477.4" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="330.9" y1="452.2" x2="355.5" y2="427.0" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="380.1" y1="401.8" x2="404.7" y2="376.6" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="425.2" y1="355.6" x2="449.8" y2="330.4" stroke="#1f6fb2" stroke-width="8" stroke-linecap="round"/>
<line x1="466.2" y1="565.6" x2="490.8" y2="540.4" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="511.3" y1="519.4" x2="535.9" y2="494.2" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="560.5" y1="469.0" x2="585.1" y2="443.8" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="609.7" y1="418.6" x2="634.3" y2="393.4" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="658.9" y1="368.2" x2="683.5" y2="343.0" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="708.1" y1="317.8" x2="732.7" y2="292.6" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<line x1="749.1" y1="275.8" x2="773.7" y2="250.6" stroke="#7b4fa0" stroke-width="8" stroke-linecap="round"/>
<text x="118.0" y="855.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" font-style="normal" fill="#5f6368" text-anchor="end">records</text>
<rect x="131.0" y="838.0" width="326.0" height="24.0" fill="#1f6fb2" rx="3"/>
<text x="294.0" y="855.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">record 1: primary</text>
<rect x="459.0" y="838.0" width="326.0" height="24.0" fill="#7b4fa0" rx="3"/>
<text x="622.0" y="855.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">record 2: supplementary</text>
<text x="458.0" y="888.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#5f6368" text-anchor="middle">adjacent on the read: no read base is reported twice</text>
<rect x="802.0" y="322.0" width="64.0" height="252.0" fill="#fff1cc"/>
<rect x="808.0" y="322.0" width="22.0" height="336.0" fill="#1f6fb2" rx="3"/>
<text x="819.0" y="314.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#1f6fb2" text-anchor="middle">1</text>
<rect x="838.0" y="238.0" width="22.0" height="336.0" fill="#7b4fa0" rx="3"/>
<text x="849.0" y="230.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#7b4fa0" text-anchor="middle">2</text>
<text x="834.0" y="682.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#5f6368" text-anchor="middle">records on</text>
<text x="834.0" y="700.9" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#5f6368" text-anchor="middle">the reference</text>
<line x1="870.0" y1="322.0" x2="878.0" y2="322.0" stroke="#222222" stroke-width="2" stroke-linecap="butt"/>
<line x1="878.0" y1="322.0" x2="878.0" y2="574.0" stroke="#222222" stroke-width="2" stroke-linecap="butt"/>
<line x1="870.0" y1="574.0" x2="878.0" y2="574.0" stroke="#222222" stroke-width="2" stroke-linecap="butt"/>
<text x="886.0" y="444.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">overlap</text>
<text x="886.0" y="464.2" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">= D = 6 kb</text>
<circle cx="1025" cy="163" r="15" fill="#222222"/>
<text x="1025.0" y="169.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">1</text>
<text x="1052.0" y="170.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">The read passes through B twice</text>
<text x="1010.0" y="206.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">Its second copy of B maps to the same reference as the</text>
<text x="1010.0" y="227.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">first, so those seeds sit on a parallel diagonal, shifted</text>
<text x="1010.0" y="249.2" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">down by the unit length D.</text>
<circle cx="1025" cy="309" r="15" fill="#222222"/>
<text x="1025.0" y="315.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">2</text>
<text x="1052.0" y="316.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">One backward jump joins the passes</text>
<text x="1010.0" y="352.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">Same chromosome and strand, diagonal shift D: the jump</text>
<text x="1010.0" y="373.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">costs min(6 + D, 35 + log<tspan dy="4.8" font-size="11.2">2</tspan><tspan dy="-4.8">(1 + D)) bits. The second</tspan></text>
<text x="1010.0" y="395.2" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">copy’s bases earn 2 bits each, so the chain takes the jump</text>
<text x="1010.0" y="416.8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">rather than leave them unexplained.</text>
<circle cx="1025" cy="477" r="15" fill="#222222"/>
<text x="1025.0" y="483.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">3</text>
<text x="1052.0" y="484.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">The jump starts a new record</text>
<text x="1010.0" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">It steps back further than the next seed’s length, so it is</text>
<text x="1010.0" y="541.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">a repeat edge, not a continuation. Record 1 (A + B) and</text>
<text x="1010.0" y="563.2" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">record 2 (B + C) meet on the read and overlap on the</text>
<text x="1010.0" y="584.8" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">reference by exactly the duplicated unit.</text>
<circle cx="1025" cy="645" r="15" fill="#222222"/>
<text x="1025.0" y="651.0" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#ffffff" text-anchor="middle">4</text>
<text x="1052.0" y="652.0" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" font-style="normal" fill="#222222" text-anchor="start">Shorter copies stay in one record</text>
<text x="1010.0" y="688.0" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">If the copy steps back at most 5 kb and its flanks can be</text>
<text x="1010.0" y="709.6" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">joined, its seeds are dropped and the gap aligner reports</text>
<text x="1010.0" y="731.2" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" font-style="normal" fill="#5f6368" text-anchor="start">the second copy as a D-bp insertion:</text>
<rect x="1010.0" y="768.0" width="250.0" height="24.0" fill="#1f6fb2" rx="3"/>
<rect x="1260.0" y="762.0" width="4.0" height="36.0" fill="#c0392b"/>
<text x="1262.0" y="818.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" font-style="normal" fill="#c0392b" text-anchor="middle">insertion of D bp</text>
<text x="1010.0" y="852.0" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" font-style="italic" fill="#5f6368" text-anchor="start">one record across A, B and C</text>
<rect x="1264.0" y="768.0" width="160.0" height="24.0" fill="#1f6fb2" rx="3"/>
<text x="130.0" y="936.0" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" font-style="italic" fill="#5f6368" text-anchor="start">Schematic, not to scale. Default parameters; bits = −log<tspan dy="4.2" font-size="9.8">2</tspan><tspan dy="-4.2"> P.</tspan></text>
</svg>
