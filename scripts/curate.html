<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Parallax Curation</title>
    <script src="https://cdn.jsdelivr.net/npm/igv@3.0.2/dist/igv.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      #header {
        padding: 8px 16px;
        background: #1a1a2e;
        color: white;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #header h1 {
        margin: 0;
        font-size: 1.1em;
      }
      #progress {
        font-size: 0.9em;
        opacity: 0.8;
      }
      #read-info {
        font-size: 0.85em;
        opacity: 0.9;
        font-family: monospace;
      }
      #igv-container {
        flex: 1;
        overflow: hidden;
      }
      #controls {
        padding: 10px 16px;
        background: #f5f5f5;
        border-top: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 20px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #btn-mm2 {
        background: #2196f3;
        color: white;
      }
      #btn-plx {
        background: #4caf50;
        color: white;
      }
      #btn-neither {
        background: #ff5722;
        color: white;
      }
      #btn-clip {
        background: #795548;
        color: white;
      }
      #btn-skip {
        background: #9e9e9e;
        color: white;
      }
      button:hover {
        opacity: 0.85;
      }
      #notes {
        flex: 1;
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.95em;
      }
      #done-banner {
        display: none;
        padding: 40px;
        text-align: center;
        font-size: 1.4em;
        color: #333;
      }
      #seg-nav {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 0.9em;
      }
      #seg-nav button {
        padding: 4px 10px;
        font-size: 0.9em;
        background: #455a64;
        color: white;
      }
      #seg-label {
        min-width: 120px;
        text-align: center;
        font-family: monospace;
        font-size: 0.8em;
      }
      #loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.75);
        align-items: center;
        justify-content: center;
        font-size: 1.3em;
        color: #555;
        z-index: 100;
        pointer-events: none;
      }
      #igv-wrapper {
        position: relative;
        flex: 1;
        min-height: 200px;
        overflow: hidden;
      }
      #layout-panel {
        padding: 4px 8px;
        background: #fafafa;
        border-top: 8px solid #f0f0f0;
        display: none;
        flex-direction: column;
        gap: 2px;
        flex-shrink: 0;
      }
      .layout-header {
        display: flex;
        font-size: 0.7em;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .layout-header-spacer {
        width: 52px;
        flex-shrink: 0;
      }
      .layout-header-read, .layout-header-genomic {
        flex: 1;
        padding: 0 8px;
      }
      .layout-header-read {
        border-right: 1px solid #e0e0e0;
      }
      .layout-row {
        display: flex;
        align-items: center;
        gap: 0;
        font-size: 0.75em;
        color: #555;
      }
      .layout-label {
        width: 52px;
        flex-shrink: 0;
        font-weight: bold;
        font-size: 0.9em;
      }
      .layout-read-wrap, .layout-genomic-wrap {
        flex: 1;
        min-width: 0;
        padding: 0 8px;
        overflow: visible;
      }
      .layout-read-wrap {
        border-right: 1px solid #e0e0e0;
        align-self: stretch;
      }
      .layout-svg-wrap { flex: 1; overflow: visible; }
      .layout-seg {
        cursor: pointer;
      }
      .layout-seg:hover polygon {
        opacity: 0.75;
      }
      .layout-seg text {
        pointer-events: none;
        user-select: text;
      }
      #seg-tooltip {
        display: none;
        position: fixed;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 0.8em;
        font-family: monospace;
        color: #333;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        pointer-events: auto;
        z-index: 200;
        line-height: 1.6;
        white-space: nowrap;
        user-select: text;
      }
      /* ── Synteny modal ─────────────────────────────────────────────────── */
      #synteny-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.45);
        z-index: 300;
        align-items: center;
        justify-content: center;
      }
      #synteny-modal {
        background: #fff;
        border-radius: 6px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.35);
        width: 95vw;
        max-width: 1600px;
        height: 92vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #synteny-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        background: #263238;
        color: #fff;
        flex-shrink: 0;
      }
      #synteny-header h2 { margin: 0; font-size: 1em; font-weight: 600; }
      #synteny-toggle {
        display: flex;
        gap: 0;
        margin-left: 8px;
      }
      #synteny-toggle button {
        padding: 4px 14px;
        font-size: 0.85em;
        background: #37474f;
        color: #cfd8dc;
        border-radius: 0;
        border: 1px solid #546e7a;
      }
      #synteny-toggle button.active {
        background: #0288d1;
        color: #fff;
        border-color: #0288d1;
      }
      #synteny-toggle button:first-child { border-radius: 4px 0 0 4px; }
      #synteny-toggle button:last-child  { border-radius: 0 4px 4px 0; }
      #synteny-close {
        margin-left: auto;
        background: transparent;
        color: #fff;
        font-size: 1.3em;
        padding: 2px 8px;
        line-height: 1;
      }
      #synteny-canvas-wrap {
        flex: 1;
        overflow: auto;
        padding: 12px;
        background: #fafafa;
        min-height: 0;
      }
      #synteny-canvas {
        display: block;
        cursor: crosshair;
      }
      #synteny-hover {
        position: fixed;
        display: none;
        background: rgba(0,0,0,0.78);
        color: #fff;
        font-family: monospace;
        font-size: 0.78em;
        padding: 5px 9px;
        border-radius: 4px;
        pointer-events: none;
        z-index: 400;
        white-space: nowrap;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>Parallax Curation</h1>
      <span id="progress"></span>
      <span id="read-info"></span>
    </div>
    <div id="igv-wrapper">
      <div id="igv-container"></div>
      <div id="loading-overlay">Loading&hellip;</div>
    </div>
    <div id="seg-tooltip"></div>

    <!-- Synteny plot modal -->
    <div id="synteny-backdrop">
      <div id="synteny-modal">
        <div id="synteny-header">
          <h2>Dot plot</h2>
          <div id="synteny-toggle">
            <button id="syn-btn-seeds" class="active" onclick="setSyntenyMode('seeds')">Seeds</button>
            <button id="syn-btn-aln" onclick="setSyntenyMode('alignment')">Alignment</button>
          </div>
          <button id="synteny-close" onclick="closeSynteny()" title="Close">&times;</button>
        </div>
        <div id="synteny-canvas-wrap">
          <canvas id="synteny-canvas"></canvas>
        </div>
      </div>
    </div>
    <div id="synteny-hover"></div>
    <div id="layout-panel">
      <div class="layout-header">
        <div class="layout-header-spacer"></div>
        <div class="layout-header-read">read</div>
        <div class="layout-header-genomic">genomic</div>
      </div>
      <div class="layout-row">
        <span class="layout-label" style="color:#2196F3">mm2</span>
        <div class="layout-read-wrap"><svg id="layout-svg-mm2" height="28"></svg></div>
        <div class="layout-genomic-wrap"><svg id="layout-gsvg-mm2" height="28"></svg></div>
      </div>
      <div class="layout-row">
        <span class="layout-label" style="color:#4CAF50">plx</span>
        <div class="layout-read-wrap"><svg id="layout-svg-plx" height="28"></svg></div>
        <div class="layout-genomic-wrap"><svg id="layout-gsvg-plx" height="28"></svg></div>
      </div>
    </div>
    <div id="controls">
      <button id="btn-mm2" onclick="submitVerdict('mm2')">minimap2 correct</button>
      <button id="btn-plx" onclick="submitVerdict('plx')">parallax correct</button>
      <button id="btn-neither" onclick="submitVerdict('neither')">neither</button>
      <button id="btn-clip" onclick="submitVerdict('clip')">clip</button>
      <button id="btn-skip" onclick="submitVerdict('skip')">skip</button>
      <button id="btn-dotplot" onclick="openSynteny()" style="background:#546e7a;color:white;">dot plot</button>
      <div id="seg-nav">
        <button onclick="goToSegment(0)" title="Return to first segment">&#8962;</button>
        <button id="seg-prev" onclick="stepSegment(-1)">&#8592;</button>
        <span id="seg-label"></span>
        <button id="seg-next" onclick="stepSegment(+1)">&#8594;</button>
      </div>
      <input id="notes" type="text" placeholder="Notes (optional)" />
    </div>
    <div id="done-banner">All reads curated. Run build_truth_bam.py to generate the truth BAM.</div>

    <script>
      const REFERENCE = __REFERENCE_JSON__;
      let browser = null;
      let currentRead = null;
      let segments = []; // [{chrom, start, end}] — one per distinct locus
      let segIndex = 0;

      // Parse all distinct loci from a fingerprint string.
      // Each segment becomes a padded locus (10% of segment width on each side).
      function parseLoci(fp) {
        if (!fp) return [];
        const loci = [];
        for (const seg of fp.split(";")) {
          const m = seg.match(/^(\S+):(\d+)-(\d+):/);
          if (!m) continue;
          const start = parseInt(m[2]),
            end = parseInt(m[3]);
          const pad = Math.round((end - start) * 0.1);
          loci.push({ chrom: m[1], start: start - pad, end: end + pad });
        }
        return loci;
      }

      // Merge loci on the same chrom only when they overlap or are within MAX_MERGE_GAP bp.
      // Segments further apart are kept as separate navigation stops.
      const MAX_MERGE_GAP = 50000;
      function mergeLoci(loci) {
        const merged = [];
        for (const l of loci) {
          const last = merged[merged.length - 1];
          if (last && last.chrom === l.chrom && l.start <= last.end + MAX_MERGE_GAP) {
            last.start = Math.min(last.start, l.start);
            last.end = Math.max(last.end, l.end);
          } else {
            merged.push({ ...l });
          }
        }
        return merged;
      }

      function locusStr(seg) {
        return `${seg.chrom}:${Math.max(0, seg.start)}-${seg.end}`;
      }

      async function goToSegment(idx) {
        segIndex = Math.max(0, Math.min(idx, segments.length - 1));
        const seg = segments[segIndex];
        document.getElementById("seg-label").textContent = `seg ${segIndex + 1}/${segments.length}  ${seg.chrom}`;
        await browser.search(locusStr(seg));
      }

      async function stepSegment(delta) {
        await goToSegment(segIndex + delta);
      }

      function setReadonly(on) {
        for (const id of ["btn-mm2", "btn-plx", "btn-neither", "btn-clip", "btn-skip"])
          document.getElementById(id).disabled = on;
        let banner = document.getElementById("readonly-banner");
        if (on && !banner) {
          banner = document.createElement("div");
          banner.id = "readonly-banner";
          banner.style.cssText = "padding:4px 12px;background:#fff3e0;color:#e65100;font-size:0.85em;border-top:1px solid #ffe0b2;flex-shrink:0;";
          document.getElementById("controls").before(banner);
        }
        if (banner) banner.style.display = on ? "block" : "none";
        if (on && banner) banner.textContent = "Read-only — this read has already been curated.";
      }

      async function loadRead(readName) {
        const url = readName ? `/api/goto/${encodeURIComponent(readName)}` : "/api/current";
        const resp = await fetch(url);
        if (!resp.ok) {
          // Unknown read name — fall back to current
          return loadRead(null);
        }
        const data = await resp.json();

        if (data.done) {
          document.getElementById("controls").style.display = "none";
          document.getElementById("igv-container").style.display = "none";
          document.getElementById("done-banner").style.display = "block";
          document.getElementById("progress").textContent = "Done!";
          history.replaceState(null, "", "/");
          return;
        }

        currentRead = data.read_name;
        const qs = "?read=" + encodeURIComponent(currentRead);
        history.replaceState(null, "", qs);
        setReadonly(data.readonly || false);
        document.getElementById("notes").value = data.readonly ? (data.notes || "") : "";
        document.getElementById("progress").textContent = `${data.stats.position + 1} / ${data.stats.total_queue}`;
        document.getElementById("read-info").textContent = currentRead;

        // Build segment list from both fingerprints, merge overlaps
        const raw = [...parseLoci(data.plx_fingerprint), ...parseLoci(data.mm2_fingerprint)];
        // Deduplicate by locus string before merging
        const seen = new Set();
        const deduped = raw.filter((l) => {
          const k = locusStr(l);
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
        deduped.sort((a, b) => (a.chrom < b.chrom ? -1 : a.chrom > b.chrom ? 1 : a.start - b.start));
        segments = mergeLoci(deduped);
        segIndex = 0;

        // Always show the nav (for the home button); show arrows only with multiple segments
        const nav = document.getElementById("seg-nav");
        nav.style.display = "flex";
        const multi = segments.length > 1;
        document.getElementById("seg-prev").style.display = multi ? "" : "none";
        document.getElementById("seg-next").style.display = multi ? "" : "none";
        document.getElementById("seg-label").style.display = multi ? "" : "none";

        const tracks = [
          {
            name: "minimap2",
            url: data.tracks.mm2_full,
            indexURL: data.tracks.mm2_full + ".bai",
            format: "bam",
            color: "#2196F3",
            height: 200,
            visibilityWindow: -1,
          },
          {
            name: "parallax",
            url: data.tracks.plx_full,
            indexURL: data.tracks.plx_full + ".bai",
            format: "bam",
            color: "#4CAF50",
            height: 200,
            visibilityWindow: -1,
          },
        ];
        if (data.tracks.plx_read) {
          tracks.push({
            name: "parallax (this read)",
            url: data.tracks.plx_read,
            indexURL: data.tracks.plx_read + ".bai",
            format: "bam",
            color: "#FF9800",
            height: 100,
            visibilityWindow: -1,
          });
        }
        if (data.tracks.plx_seeds) {
          tracks.push({
            name: "seeds (this read)",
            url: data.tracks.plx_seeds,
            indexURL: data.tracks.plx_seeds + ".bai",
            format: "bam",
            color: "#9C27B0",
            height: 100,
            visibilityWindow: -1,
          });
        }
        for (const t of data.extra_tracks || []) {
          tracks.push({ visibilityWindow: -1, ...t, name: t.name || t.url.split("/").pop() });
        }


        if (!browser) {
          const options = {
            reference: REFERENCE,
            locus: locusStr(segments[0]),
            tracks: tracks,
            showSVGButton: false,
            search: false,
            blat: false,
          };
          browser = await igv.createBrowser(document.getElementById("igv-container"), options);
        } else {
          const existing = browser.trackViews.map((tv) => tv.track).filter((t) => t.type !== "sequence" && t.id !== "ruler");
          for (const t of existing) {
            await browser.removeTrack(t);
          }
          for (const t of tracks) {
            await browser.loadTrack(t);
          }
        }
        await goToSegment(0);
        renderLayout(data.plx_fingerprint, data.mm2_fingerprint);
        setLoading(false);
      }

      function loadCurrent() {
        const params = new URLSearchParams(window.location.search);
        const readName = params.get("read") || null;
        return loadRead(readName);
      }

      // ── Read layout panel ───────────────────────────────────────────────────

      const LABEL_GAP = 50;      // bp: show numeric length on gaps/clips >= this
      const LAYOUT_ROW_H = 50;   // shared SVG height for read and genomic rows

      // Parse fingerprint into segments sorted by read (query) order.
      // Returns { segs, readLen } where segs are [{chrom,refStart,refEnd,strand,qStart,qEnd,locusKey}]
      function parseFp(fp) {
        if (!fp) return { segs: [], readLen: 0 };
        const segs = [];
        for (const part of fp.split(';')) {
          const m = part.match(/^(\S+):(\d+)-(\d+):([+-]):(\d+)-(\d+)$/);
          if (!m) continue;
          segs.push({
            chrom: m[1], refStart: +m[2], refEnd: +m[3],
            strand: m[4], qStart: +m[5], qEnd: +m[6],
            locusKey: `${m[1]}:${m[2]}-${m[3]}`,
          });
        }
        segs.sort((a, b) => a.qStart - b.qStart);
        const readLen = segs.length ? segs[segs.length - 1].qEnd : 0;
        return { segs, readLen };
      }

      // Build a map from locusKey -> index in the global `segments` array
      // so clicking a layout box navigates to the right IGV stop.
      function buildLocusIndex() {
        const idx = {};
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          // key format matches locusStr but without padding — match on chrom only as fallback
          idx[`${s.chrom}:${s.start}-${s.end}`] = i;
        }
        return idx;
      }

      // Find the IGV segment index that best contains a layout segment.
      function findIgvIdx(seg, locusIdx) {
        // Try each IGV segment: find the one whose chrom matches and whose
        // range overlaps the segment's reference range.
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          if (s.chrom === seg.chrom && s.start <= seg.refEnd && s.end >= seg.refStart) return i;
        }
        return 0;
      }

      // Darken/lighten a hex colour by a factor (-1..1, negative = darker).
      function shadeColor(hex, factor) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 0xff) * (1 + factor))));
        const g = Math.min(255, Math.max(0, Math.round(((n >>  8) & 0xff) * (1 + factor))));
        const b = Math.min(255, Math.max(0, Math.round(( n        & 0xff) * (1 + factor))));
        return `#${((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}`;
      }

      // Measure text width by temporarily rendering into the SVG.
      function measureText(svgEl, text, fontSize, fontFamily) {
        const ns = 'http://www.w3.org/2000/svg';
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('font-size', fontSize);
        t.setAttribute('font-family', fontFamily);
        t.setAttribute('visibility', 'hidden');
        t.textContent = text;
        svgEl.appendChild(t);
        const w = t.getComputedTextLength();
        svgEl.removeChild(t);
        return w;
      }

      function renderLayoutRow(svgEl, segs, readLen, color) {
        while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
        if (!segs.length) return;

        const ns = 'http://www.w3.org/2000/svg';
        const H = 20, Y = (LAYOUT_ROW_H - H) / 2;  // vertically centred
        const ARROW = 8;             // arrowhead depth (px)
        const PAD = 6;               // horizontal text padding inside box
        const GAP_LINE = 16;         // thin gap connector width (px)
        const GAP_LABEL_W = 36;      // extra gap width when showing a label
        const CLIP_W = 10;           // whisker width (px)
        const CLIP_LABEL_W = 28;     // extra clip width when showing a label
        const FONT_SIZE = '9';
        const FONT_FAMILY = 'monospace';

        const leftClip  = segs[0].qStart;
        const rightClip = readLen > 0 ? readLen - segs[segs.length - 1].qEnd : 0;
        const gaps = [];
        for (let i = 1; i < segs.length; i++) gaps.push(segs[i].qStart - segs[i - 1].qEnd);

        // Build label strings and measure natural text widths
        const labels = segs.map(seg => {
          const locus = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;
          const len = (seg.refEnd - seg.refStart).toLocaleString();
          return { locus, full: locus };
        });
        const textWidths = labels.map(l => measureText(svgEl, l.full, FONT_SIZE, FONT_FAMILY));

        // Box width = text width + padding + arrowhead
        const boxWidths = textWidths.map(tw => tw + PAD * 2 + ARROW);

        function bpLabel(bp) {
          return bp >= 1000 ? `${(bp / 1000).toFixed(1)}k` : `${bp}`;
        }

        // Build item list
        const items = [];
        if (leftClip > 0)
          items.push({ type: 'clip', bp: leftClip, side: 'left',
                       w: CLIP_W + (leftClip >= LABEL_GAP ? CLIP_LABEL_W : 0) });
        for (let i = 0; i < segs.length; i++) {
          items.push({ type: 'seg', seg: segs[i], label: labels[i], w: boxWidths[i] });
          if (i < segs.length - 1)
            items.push({ type: 'gap', bp: gaps[i],
                         w: GAP_LINE + (gaps[i] >= LABEL_GAP ? GAP_LABEL_W : 0) });
        }
        if (rightClip > 0)
          items.push({ type: 'clip', bp: rightClip, side: 'right',
                       w: CLIP_W + (rightClip >= LABEL_GAP ? CLIP_LABEL_W : 0) });

        let x = 0;
        for (const item of items) {
          const midY = Y + H / 2;

          if (item.type === 'clip') {
            const cw = item.w;
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', x); line.setAttribute('x2', x + cw);
            line.setAttribute('y1', midY); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#aaa'); line.setAttribute('stroke-width', 1.5);
            svgEl.appendChild(line);
            if (item.bp >= LABEL_GAP) {
              const t = document.createElementNS(ns, 'text');
              t.setAttribute('x', x + cw / 2); t.setAttribute('y', Y + H + 9);
              t.setAttribute('text-anchor', 'middle');
              t.setAttribute('font-size', '8'); t.setAttribute('fill', '#999');
              t.textContent = bpLabel(item.bp);
              svgEl.appendChild(t);
            }
            x += cw;

          } else if (item.type === 'gap') {
            if (item.bp <= 0) continue;
            const gw = item.w;
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', x); line.setAttribute('x2', x + gw);
            line.setAttribute('y1', midY); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#bbb'); line.setAttribute('stroke-width', 1);
            svgEl.appendChild(line);
            if (item.bp >= LABEL_GAP) {
              const t = document.createElementNS(ns, 'text');
              t.setAttribute('x', x + gw / 2); t.setAttribute('y', midY - 4);
              t.setAttribute('text-anchor', 'middle');
              t.setAttribute('font-size', '8'); t.setAttribute('fill', '#aaa');
              t.textContent = bpLabel(item.bp);
              svgEl.appendChild(t);
            }
            x += gw;

          } else { // seg
            const seg = item.seg;
            const w = item.w;
            const fwd = seg.strand === '+';
            const igvIdx = findIgvIdx(seg, {});

            const g = document.createElementNS(ns, 'g');
            g.setAttribute('class', 'layout-seg');

            const x0 = x, x1 = x + w, ya = Y, yb = Y + H;
            const aw = ARROW;
            let pts;
            if (fwd) {
              pts = [[x0,ya],[x1-aw,ya],[x1,midY],[x1-aw,yb],[x0,yb]];
            } else {
              pts = [[x0+aw,ya],[x1,ya],[x1,yb],[x0+aw,yb],[x0,midY]];
            }
            const poly = document.createElementNS(ns, 'polygon');
            poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
            poly.setAttribute('fill', color);
            poly.setAttribute('stroke', shadeColor(color, -0.3));
            poly.setAttribute('stroke-width', '1');
            svgEl.appendChild(poly);
            g.appendChild(poly);

            const t = document.createElementNS(ns, 'text');
            t.setAttribute('x', fwd ? x0 + PAD : x0 + aw + PAD);
            t.setAttribute('y', midY + 4);
            t.setAttribute('font-size', FONT_SIZE);
            t.setAttribute('font-family', FONT_FAMILY);
            t.setAttribute('fill', 'white');
            t.textContent = item.label.full;
            g.appendChild(t);

            // Drag-aware click: only navigate if mouse hasn't moved significantly
            let mouseDownPos = null;
            g.addEventListener('mousedown', e => { mouseDownPos = { x: e.clientX, y: e.clientY }; });
            g.addEventListener('click', e => {
              if (!mouseDownPos) return;
              const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
              mouseDownPos = null;
              if (Math.sqrt(dx*dx + dy*dy) < 5) goToSegment(igvIdx);
            });

            // Hover tooltip — positioned on entry, stays still so text is selectable
            const tooltip = document.getElementById('seg-tooltip');
            const refLen = (seg.refEnd - seg.refStart).toLocaleString();
            const qLen   = (seg.qEnd - seg.qStart).toLocaleString();
            const strand = seg.strand === '+' ? '(+)' : '(−)';
            const tooltipHTML =
              `<b>${item.label.locus} ${strand}</b><br>` +
              `ref length: ${refLen} bp<br>` +
              `read: ${seg.qStart.toLocaleString()}–${seg.qEnd.toLocaleString()}<br>` +
              `read length: ${qLen} bp`;
            let showTimer = null;
            g.addEventListener('mouseenter', e => {
              showTimer = setTimeout(() => {
                tooltip.innerHTML = tooltipHTML;
                tooltip.style.left = (e.clientX + 14) + 'px';
                tooltip.style.top  = (e.clientY + 14) + 'px';
                tooltip.style.display = 'block';
              }, 300);
            });
            g.addEventListener('mouseleave', e => {
              clearTimeout(showTimer);
              // Delay hide so mouse can move onto the tooltip without it vanishing
              setTimeout(() => {
                if (!tooltip.matches(':hover')) tooltip.style.display = 'none';
              }, 100);
            });

            g.setAttribute('data-locus', item.label.locus);
            svgEl.appendChild(g);
            x += w;
          }
        }

        svgEl.setAttribute('width', x);
        svgEl.setAttribute('viewBox', `0 0 ${x} ${LAYOUT_ROW_H}`);
        svgEl.setAttribute('height', LAYOUT_ROW_H);
      }

      // ── Genomic layout panel ────────────────────────────────────────────────

      // Chromosome sort order: chr1..22, chrX, chrY, then everything else.
      function chromOrder(chrom) {
        const s = chrom.replace(/^chr/i, '');
        if (s === 'X') return 23;
        if (s === 'Y') return 24;
        const n = parseInt(s);
        return isNaN(n) ? 99 : n;
      }

      function renderGenomicRow(svgEl, segs, color) {
        while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
        if (!segs.length) return;

        const ns = 'http://www.w3.org/2000/svg';
        const H = 20, Y = (LAYOUT_ROW_H - H) / 2;  // box placement, centred in row
        const ARC_H = 28;              // arc peak height above/below box edges
        const ARROW = 8;
        const PAD = 6;
        const CHROM_GAP = 20;          // px between chromosome groups
        const SEG_GAP = 12;            // px between segments on the same chrom
        const FONT_SIZE = '9';
        const FONT_FAMILY = 'monospace';
        const ARROWHEAD = 5;           // arrowhead size on connectors

        // Sort segments by genomic position (chrom order, then refStart).
        // Keep a parallel array of read-order indices so we can draw arrows in read order.
        const genomicOrder = segs
          .map((seg, readIdx) => ({ seg, readIdx }))
          .sort((a, b) => {
            const dc = chromOrder(a.seg.chrom) - chromOrder(b.seg.chrom);
            return dc !== 0 ? dc : a.seg.refStart - b.seg.refStart;
          });

        // Measure box widths
        const boxWidths = genomicOrder.map(({ seg }) => {
          const label = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;
          return measureText(svgEl, label, FONT_SIZE, FONT_FAMILY) + PAD * 2 + ARROW;
        });

        // Assign x positions, grouping by chromosome
        const positions = [];  // x centre of each box (genomicOrder index)
        let x = 0;
        let prevChrom = null;
        for (let i = 0; i < genomicOrder.length; i++) {
          const chrom = genomicOrder[i].seg.chrom;
          if (prevChrom !== null) x += chrom === prevChrom ? SEG_GAP : CHROM_GAP;
          positions.push(x);
          x += boxWidths[i];
          prevChrom = chrom;
        }
        const totalW = x;

        // Build lookup: readIdx -> genomic position index
        const readToGenomic = {};
        genomicOrder.forEach(({ readIdx }, gi) => { readToGenomic[readIdx] = gi; });

        // Draw boxes
        const midY = Y + H / 2;
        for (let gi = 0; gi < genomicOrder.length; gi++) {
          const { seg, readIdx } = genomicOrder[gi];
          const bx = positions[gi];
          const bw = boxWidths[gi];
          const fwd = seg.strand === '+';
          const igvIdx = findIgvIdx(seg, {});
          const label = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;

          const g = document.createElementNS(ns, 'g');
          g.setAttribute('class', 'layout-seg');

          const x0 = bx, x1 = bx + bw, ya = Y, yb = Y + H, aw = ARROW;
          const pts = fwd
            ? [[x0,ya],[x1-aw,ya],[x1,midY],[x1-aw,yb],[x0,yb]]
            : [[x0+aw,ya],[x1,ya],[x1,yb],[x0+aw,yb],[x0,midY]];
          const poly = document.createElementNS(ns, 'polygon');
          poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
          poly.setAttribute('fill', color);
          poly.setAttribute('stroke', shadeColor(color, -0.3));
          poly.setAttribute('stroke-width', '1');
          g.appendChild(poly);

          const t = document.createElementNS(ns, 'text');
          t.setAttribute('x', fwd ? x0 + PAD : x0 + aw + PAD);
          t.setAttribute('y', midY + 4);
          t.setAttribute('font-size', FONT_SIZE);
          t.setAttribute('font-family', FONT_FAMILY);
          t.setAttribute('fill', 'white');
          t.textContent = label;
          g.appendChild(t);


          let mouseDownPos = null;
          g.addEventListener('mousedown', e => { mouseDownPos = { x: e.clientX, y: e.clientY }; });
          g.addEventListener('click', e => {
            if (!mouseDownPos) return;
            const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
            mouseDownPos = null;
            if (Math.sqrt(dx*dx + dy*dy) < 5) goToSegment(igvIdx);
          });

          const tooltip = document.getElementById('seg-tooltip');
          const refLen = (seg.refEnd - seg.refStart).toLocaleString();
          const qLen   = (seg.qEnd - seg.qStart).toLocaleString();
          const strand = seg.strand === '+' ? '(+)' : '(−)';
          const tooltipHTML =
            `<b>${label} ${strand}</b><br>` +
            `ref length: ${refLen} bp<br>` +
            `read: ${seg.qStart.toLocaleString()}–${seg.qEnd.toLocaleString()}<br>` +
            `read length: ${qLen} bp`;
          let showTimer = null;
          g.addEventListener('mouseenter', e => {
            showTimer = setTimeout(() => {
              tooltip.innerHTML = tooltipHTML;
              tooltip.style.left = (e.clientX + 14) + 'px';
              tooltip.style.top  = (e.clientY + 14) + 'px';
              tooltip.style.display = 'block';
            }, 300);
          });
          g.addEventListener('mouseleave', () => {
            clearTimeout(showTimer);
            setTimeout(() => { if (!tooltip.matches(':hover')) tooltip.style.display = 'none'; }, 100);
          });

          svgEl.appendChild(g);
        }

        // Draw connectors between consecutive read-order segments.
        // Arc exits the read-order end of the source box and enters the
        // read-order start of the destination box.
        for (let ri = 0; ri < segs.length - 1; ri++) {
          const fromGi  = readToGenomic[ri];
          const toGi    = readToGenomic[ri + 1];
          const fromSeg = genomicOrder[fromGi].seg;
          const toSeg   = genomicOrder[toGi].seg;

          // Read exits at the tip of the arrowhead polygon:
          //   forward (+): right edge (x + w)
          //   reverse (-): left edge  (x)
          const ax1 = fromSeg.strand === '+' ? positions[fromGi] + boxWidths[fromGi] : positions[fromGi];
          const ax2 = toSeg.strand   === '+' ? positions[toGi]                        : positions[toGi] + boxWidths[toGi];

          // Straight connector when the genomic positions are already adjacent
          // left-to-right and same chrom+strand (read flows naturally forward).
          const straightOk = fromGi < toGi &&
                             Math.abs(fromGi - toGi) === 1 &&
                             fromSeg.chrom === toSeg.chrom &&
                             fromSeg.strand === '+' && toSeg.strand === '+';

          if (straightOk) {
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', ax1); line.setAttribute('y1', midY);
            line.setAttribute('x2', ax2 - ARROWHEAD); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#888'); line.setAttribute('stroke-width', 1);
            svgEl.appendChild(line);
            const ah = document.createElementNS(ns, 'polygon');
            ah.setAttribute('points', `${ax2},${midY} ${ax2-ARROWHEAD},${midY-3} ${ax2-ARROWHEAD},${midY+3}`);
            ah.setAttribute('fill', '#888');
            svgEl.appendChild(ah);
          } else {
            // Alternate arcs above/below to reduce overlap clutter.
            const above = ri % 2 === 0;
            const cp = above ? Y - ARC_H : Y + H + ARC_H;  // bezier control point y
            const endY = midY;                               // endpoints at vertical centre
            const mx = (ax1 + ax2) / 2;
            const path = document.createElementNS(ns, 'path');
            path.setAttribute('d', `M ${ax1} ${endY} Q ${mx} ${cp} ${ax2} ${endY}`);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#888');
            path.setAttribute('stroke-width', 1);
            svgEl.appendChild(path);
            // Arrowhead tangent to arc at destination.
            // Tangent direction at end of quadratic bezier: (end - control)
            const tdx = ax2 - mx, tdy = endY - cp;
            const tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
            const ux = tdx/tlen, uy = tdy/tlen;
            const tip = [ax2, endY];
            const b1  = [ax2 - ux*ARROWHEAD - uy*3, endY - uy*ARROWHEAD + ux*3];
            const b2  = [ax2 - ux*ARROWHEAD + uy*3, endY - uy*ARROWHEAD - ux*3];
            const ah = document.createElementNS(ns, 'polygon');
            ah.setAttribute('points', `${tip[0]},${tip[1]} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}`);
            ah.setAttribute('fill', '#888');
            svgEl.appendChild(ah);
          }
        }

        svgEl.setAttribute('width', totalW);
        svgEl.setAttribute('viewBox', `0 0 ${totalW} ${LAYOUT_ROW_H}`);
        svgEl.setAttribute('height', LAYOUT_ROW_H);
        svgEl.style.overflow = 'visible';
      }

      function renderLayout(plxFp, mm2Fp) {
        const { segs: plxSegs, readLen: plxLen } = parseFp(plxFp);
        const { segs: mm2Segs, readLen: mm2Len } = parseFp(mm2Fp);

        const panel = document.getElementById('layout-panel');
        if (!plxSegs.length && !mm2Segs.length) { panel.style.display = 'none'; return; }
        panel.style.display = 'flex';

        renderLayoutRow(document.getElementById('layout-svg-mm2'), mm2Segs, mm2Len, '#2196F3');
        renderLayoutRow(document.getElementById('layout-svg-plx'), plxSegs, plxLen, '#4CAF50');
        renderGenomicRow(document.getElementById('layout-gsvg-mm2'), mm2Segs, '#2196F3');
        renderGenomicRow(document.getElementById('layout-gsvg-plx'), plxSegs, '#4CAF50');
      }

      function setLoading(on) {
        const overlay = document.getElementById("loading-overlay");
        overlay.style.display = on ? "flex" : "none";
        for (const id of ["btn-mm2", "btn-plx", "btn-neither", "btn-clip", "btn-skip"]) document.getElementById(id).disabled = on;
      }

      async function submitVerdict(verdict) {
        if (!currentRead) return;
        setLoading(true);
        const notes = document.getElementById("notes").value.trim();
        await fetch("/api/verdict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ read_name: currentRead, verdict, notes }),
        });
        history.pushState(null, "", "?read=" + encodeURIComponent(currentRead));
        loadRead(null);
      }

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target.id === "notes") return;
        if (e.key === "1") submitVerdict("mm2");
        if (e.key === "2") submitVerdict("plx");
        if (e.key === "3") submitVerdict("neither");
        if (e.key === "4") submitVerdict("skip");
        if (e.key === "ArrowLeft") stepSegment(-1);
        if (e.key === "ArrowRight") stepSegment(+1);
      });

      document.getElementById('seg-tooltip').addEventListener('mouseleave', () => {
        document.getElementById('seg-tooltip').style.display = 'none';
      });

      // ── Dot plot ──────────────────────────────────────────────────────────

      let syntenyData = null;      // last fetched JSON
      let syntenyMode = 'seeds';   // 'seeds' | 'alignment'

      function setSyntenyMode(mode) {
        syntenyMode = mode;
        document.getElementById('syn-btn-seeds').classList.toggle('active', mode === 'seeds');
        document.getElementById('syn-btn-aln').classList.toggle('active', mode === 'alignment');
        if (syntenyData) drawDotPlot(syntenyData);
      }

      async function openSynteny() {
        if (!currentRead) return;
        document.getElementById('synteny-backdrop').style.display = 'flex';
        const canvas = document.getElementById('synteny-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600; canvas.height = 400;
        ctx.fillStyle = '#eee';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#555';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Loading…', canvas.width / 2, canvas.height / 2);

        const resp = await fetch(`/api/synteny/${encodeURIComponent(currentRead)}`);
        if (!resp.ok) {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.fillText('Error loading data', canvas.width / 2, canvas.height / 2);
          return;
        }
        syntenyData = await resp.json();
        drawDotPlot(syntenyData);
      }

      function closeSynteny() {
        document.getElementById('synteny-backdrop').style.display = 'none';
      }
      document.getElementById('synteny-backdrop').addEventListener('click', e => {
        if (e.target === document.getElementById('synteny-backdrop')) closeSynteny();
      });

      function drawDotPlot(data) {
        const segs = syntenyMode === 'seeds' ? data.seeds : data.alignment;
        const canvas = document.getElementById('synteny-canvas');
        const wrap = document.getElementById('synteny-canvas-wrap');

        if (!segs || segs.length === 0) {
          const ctx = canvas.getContext('2d');
          canvas.width = 600; canvas.height = 200;
          ctx.fillStyle = '#fafafa'; ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#888'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('No data for this mode', canvas.width / 2, canvas.height / 2);
          return;
        }

        // ── Chromosome layout ──────────────────────────────────────────────
        // Collect per-chrom intervals actually used, compress within each chrom.
        const PAD_FRAC = 0.08;   // padding around each used interval
        const CHROM_GAP = 40;    // px between chromosomes
        const SEG_GAP   = 6;     // px between compressed intervals within a chrom

        // Gather all ref intervals per chrom
        const chromIntervals = {};  // chrom -> [{start, end}]
        for (const s of segs) {
          if (!chromIntervals[s.chrom]) chromIntervals[s.chrom] = [];
          chromIntervals[s.chrom].push({ start: s.ref_start, end: s.ref_end });
        }

        // Sort chroms
        function chromOrder(c) {
          const s = c.replace(/^chr/i, '');
          if (s === 'X') return 23; if (s === 'Y') return 24;
          const n = parseInt(s); return isNaN(n) ? 99 : n;
        }
        const chroms = Object.keys(chromIntervals).sort((a, b) => chromOrder(a) - chromOrder(b));

        // For each chrom, merge overlapping/nearby intervals (with padding) into bands.
        // Intervals more than MAX_BAND_GAP bp apart are kept as separate bands so
        // large genomic gaps get compressed rather than drawn at full scale.
        const MAX_BAND_GAP = 50000;
        function mergeIntervals(ivs, padFrac) {
          const sorted = ivs.slice().sort((a, b) => a.start - b.start);
          const merged = [];
          for (const iv of sorted) {
            const span = Math.max(1, iv.end - iv.start);
            const pad = Math.round(span * padFrac);
            const s = iv.start - pad, e = iv.end + pad;
            const last = merged[merged.length - 1];
            if (last && s <= last.end + MAX_BAND_GAP) { last.end = Math.max(last.end, e); }
            else merged.push({ start: s, end: e });
          }
          return merged;
        }

        // Build band layout per chrom: each band -> {bpStart, bpEnd, pxStart, pxWidth}
        // We'll decide px widths based on bp span, scaled uniformly across all chroms.
        const chromBands = {};
        let totalBp = 0;
        for (const c of chroms) {
          const bands = mergeIntervals(chromIntervals[c], PAD_FRAC);
          chromBands[c] = bands;
          for (const b of bands) totalBp += (b.end - b.start);
        }

        // Canvas dimensions
        const MARGIN_L = 60, MARGIN_R = 20, MARGIN_T = 30, MARGIN_B = 60;
        const availW = Math.max(600, wrap.clientWidth - 40) - MARGIN_L - MARGIN_R;
        const availH = Math.max(400, wrap.clientHeight - 40) - MARGIN_T - MARGIN_B;

        // Compute total px needed for inter-chrom and inter-band gaps
        const nChromGaps = chroms.length - 1;
        let nBandGaps = 0;
        for (const c of chroms) nBandGaps += Math.max(0, chromBands[c].length - 1);
        const fixedPx = nChromGaps * CHROM_GAP + nBandGaps * SEG_GAP;
        const bpScale = (availW - fixedPx) / Math.max(1, totalBp);  // px per bp

        // Assign px positions to bands
        let cx = 0;
        const chromMeta = {};  // chrom -> {bands: [{bpStart,bpEnd,pxStart,pxWidth}], labelX}
        for (const c of chroms) {
          const bands = chromBands[c];
          const meta = { bands: [], labelX: 0 };
          const chromStartPx = cx;
          for (let bi = 0; bi < bands.length; bi++) {
            if (bi > 0) cx += SEG_GAP;
            const bw = Math.round((bands[bi].end - bands[bi].start) * bpScale);
            meta.bands.push({ bpStart: bands[bi].start, bpEnd: bands[bi].end, pxStart: cx, pxWidth: bw });
            cx += bw;
          }
          meta.labelX = (chromStartPx + cx) / 2;
          chromMeta[c] = meta;
          cx += CHROM_GAP;
        }
        const plotW = cx - CHROM_GAP;  // trim trailing gap

        // ── Read (y) axis ─────────────────────────────────────────────────
        let readMin = Infinity, readMax = -Infinity;
        for (const s of segs) {
          readMin = Math.min(readMin, s.read_start);
          readMax = Math.max(readMax, s.read_end);
        }
        const readSpan = Math.max(1, readMax - readMin);
        const readScale = availH / readSpan;  // px per bp on read axis

        // Map a ref position on a given chrom to canvas x.
        // Returns null if the position falls outside all bands — caller skips the segment.
        function refToPx(chrom, refPos) {
          const meta = chromMeta[chrom];
          if (!meta) return null;
          for (const b of meta.bands) {
            if (refPos >= b.bpStart - 1 && refPos <= b.bpEnd + 1) {
              return MARGIN_L + b.pxStart + Math.max(0, Math.min(b.pxWidth, (refPos - b.bpStart) * bpScale));
            }
          }
          return null;
        }

        function readToPy(readPos) {
          // y=0 at top of canvas; read position 0 maps to bottom, readMax to top
          return MARGIN_T + availH - (readPos - readMin) * readScale;
        }

        // ── Draw ──────────────────────────────────────────────────────────
        canvas.width  = MARGIN_L + plotW + MARGIN_R;
        canvas.height = MARGIN_T + availH + MARGIN_B;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Chromosome labels
        chroms.forEach((c, ci) => {
          const meta = chromMeta[c];
          ctx.fillStyle = '#555';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(c, MARGIN_L + meta.labelX, MARGIN_T - 6);
        });

        // Genomic x-axis: tick marks and coordinate labels at the bottom of the plot area
        const axisY = MARGIN_T + availH;
        ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
        ctx.fillStyle = '#666'; ctx.font = '9px monospace';
        for (const c of chroms) {
          const meta = chromMeta[c];
          for (const b of meta.bands) {
            // Draw a thin axis line along the bottom of this band
            const bx1 = MARGIN_L + b.pxStart, bx2 = MARGIN_L + b.pxStart + b.pxWidth;
            ctx.beginPath(); ctx.moveTo(bx1, axisY); ctx.lineTo(bx2, axisY); ctx.stroke();
            // Place ticks at start and end of each band (in Mbp)
            const ticks = [
              { bp: b.bpStart, x: bx1, align: 'left'   },
              { bp: b.bpEnd,   x: bx2, align: 'right'  },
            ];
            for (const tk of ticks) {
              ctx.beginPath(); ctx.moveTo(tk.x, axisY); ctx.lineTo(tk.x, axisY + 4); ctx.stroke();
              const label = (tk.bp / 1e6).toFixed(2) + ' M';
              ctx.textAlign = tk.align;
              ctx.fillText(label, tk.x, axisY + 14);
            }
          }
        }

        // Band break markers (zigzag lines between bands within a chrom)
        ctx.strokeStyle = '#bbb';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 2]);
        for (const c of chroms) {
          const meta = chromMeta[c];
          for (let bi = 1; bi < meta.bands.length; bi++) {
            const bx = MARGIN_L + meta.bands[bi].pxStart - SEG_GAP / 2;
            ctx.beginPath(); ctx.moveTo(bx, MARGIN_T); ctx.lineTo(bx, MARGIN_T + availH); ctx.stroke();
          }
        }
        ctx.setLineDash([]);

        // Grid lines on read axis
        ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
        const readTickStep = niceStep(readSpan, 6);
        const readTickStart = Math.ceil(readMin / readTickStep) * readTickStep;
        ctx.fillStyle = '#999'; ctx.font = '9px monospace'; ctx.textAlign = 'right';
        for (let r = readTickStart; r <= readMax; r += readTickStep) {
          const py = readToPy(r);
          ctx.beginPath(); ctx.moveTo(MARGIN_L, py); ctx.lineTo(MARGIN_L + plotW, py); ctx.stroke();
          ctx.fillText(r.toLocaleString(), MARGIN_L - 4, py + 3);
        }

        // Axis labels
        ctx.save();
        ctx.translate(14, MARGIN_T + availH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.fillStyle = '#555'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('read position (bp)', 0, 0);
        ctx.restore();

        // Segment colours: forward=blue, reverse=orange
        const fwdColor  = syntenyMode === 'seeds' ? '#2196f3' : '#1565c0';
        const revColor  = syntenyMode === 'seeds' ? '#ff9800' : '#e65100';
        const LINE_W    = syntenyMode === 'seeds' ? 1.0 : 2.5;

        // Store drawn segments for hover hit-testing
        const drawnSegs = [];

        const DOT_R = syntenyMode === 'seeds' ? 1.5 : 3.5;
        for (const s of segs) {
          const x1 = refToPx(s.chrom, s.ref_start);
          const x2 = refToPx(s.chrom, s.ref_end);
          if (x1 === null || x2 === null) continue;
          // Reverse strand: ref_start pairs with read_end, ref_end with read_start
          const y1 = s.is_reverse ? readToPy(s.read_end)   : readToPy(s.read_start);
          const y2 = s.is_reverse ? readToPy(s.read_start) : readToPy(s.read_end);
          const color = s.is_reverse ? revColor : fwdColor;
          ctx.strokeStyle = color;
          ctx.lineWidth = LINE_W;
          ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          // Endpoint circles
          ctx.fillStyle = color;
          ctx.beginPath(); ctx.arc(x1, y1, DOT_R, 0, 2 * Math.PI); ctx.fill();
          ctx.beginPath(); ctx.arc(x2, y2, DOT_R, 0, 2 * Math.PI); ctx.fill();
          drawnSegs.push({ s, x1, y1, x2, y2 });  // y1/y2 already strand-corrected
        }

        // Legend
        const LX = MARGIN_L + plotW - 100, LY = MARGIN_T + 8;
        ctx.fillStyle = fwdColor; ctx.fillRect(LX, LY, 18, 3);
        ctx.fillStyle = '#333'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
        ctx.fillText('forward (+)', LX + 22, LY + 4);
        ctx.fillStyle = revColor; ctx.fillRect(LX, LY + 12, 18, 3);
        ctx.fillStyle = '#333';
        ctx.fillText('reverse (−)', LX + 22, LY + 16);

        // ── Hover hit-testing ─────────────────────────────────────────────
        const hover = document.getElementById('synteny-hover');
        canvas._drawnSegs = drawnSegs;
        canvas._readMin = readMin;
        canvas._bpScale = bpScale;
        canvas._readScale = readScale;
        canvas._marginL = MARGIN_L;
        canvas._marginT = MARGIN_T;
      }

      function niceStep(range, targetTicks) {
        const rough = range / targetTicks;
        const mag = Math.pow(10, Math.floor(Math.log10(rough)));
        const norm = rough / mag;
        if (norm < 1.5) return mag;
        if (norm < 3.5) return 2 * mag;
        if (norm < 7.5) return 5 * mag;
        return 10 * mag;
      }

      // Hover: find nearest segment endpoint within a tolerance
      document.getElementById('synteny-canvas').addEventListener('mousemove', e => {
        const canvas = document.getElementById('synteny-canvas');
        const hover  = document.getElementById('synteny-hover');
        const drawnSegs = canvas._drawnSegs;
        if (!drawnSegs) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const TOL = 6;
        let best = null, bestDist = TOL + 1;
        for (const d of drawnSegs) {
          // Distance from point to line segment
          const dx = d.x2 - d.x1, dy = d.y2 - d.y1;
          const len2 = dx*dx + dy*dy;
          let dist;
          if (len2 === 0) {
            dist = Math.hypot(mx - d.x1, my - d.y1);
          } else {
            const t = Math.max(0, Math.min(1, ((mx-d.x1)*dx + (my-d.y1)*dy) / len2));
            dist = Math.hypot(mx - (d.x1 + t*dx), my - (d.y1 + t*dy));
          }
          if (dist < bestDist) { bestDist = dist; best = d; }
        }
        if (best) {
          const s = best.s;
          const refLen = (s.ref_end - s.ref_start).toLocaleString();
          const readLen = (s.read_end - s.read_start).toLocaleString();
          const strand = s.is_reverse ? '(−)' : '(+)';
          hover.innerHTML =
            `<b>${s.chrom}:${s.ref_start.toLocaleString()}–${s.ref_end.toLocaleString()} ${strand}</b><br>` +
            `ref length: ${refLen} bp<br>` +
            `read: ${s.read_start.toLocaleString()}–${s.read_end.toLocaleString()}  (${readLen} bp)` +
            (s.mapq !== undefined ? `<br>mapq: ${s.mapq}` : '');
          hover.style.left = (e.clientX + 14) + 'px';
          hover.style.top  = (e.clientY + 14) + 'px';
          hover.style.display = 'block';
        } else {
          hover.style.display = 'none';
        }
      });
      document.getElementById('synteny-canvas').addEventListener('mouseleave', () => {
        document.getElementById('synteny-hover').style.display = 'none';
      });

      window.addEventListener('popstate', () => {
        const params = new URLSearchParams(window.location.search);
        const readName = params.get("read") || null;
        setLoading(true);
        loadRead(readName);
      });


      loadCurrent();
    </script>
  </body>
</html>
