<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Parallax Curation</title>
    <script src="https://cdn.jsdelivr.net/npm/igv@3.0.2/dist/igv.min.js"></script>
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      #header {
        padding: 8px 16px;
        background: #1a1a2e;
        color: white;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      #header h1 {
        margin: 0;
        font-size: 1.1em;
      }
      #progress {
        font-size: 0.9em;
        opacity: 0.8;
      }
      #read-info {
        font-size: 0.85em;
        opacity: 0.9;
        font-family: monospace;
      }
      #igv-container {
        flex: 1;
        overflow: hidden;
      }
      #controls {
        padding: 10px 16px;
        background: #f5f5f5;
        border-top: 1px solid #ddd;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 8px 20px;
        font-size: 1em;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      #btn-mm2 {
        background: #2196f3;
        color: white;
      }
      #btn-plx {
        background: #4caf50;
        color: white;
      }
      #btn-neither {
        background: #ff5722;
        color: white;
      }
      #btn-skip {
        background: #9e9e9e;
        color: white;
      }
      button:hover {
        opacity: 0.85;
      }
      #notes {
        flex: 1;
        padding: 7px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 0.95em;
      }
      #done-banner {
        display: none;
        padding: 40px;
        text-align: center;
        font-size: 1.4em;
        color: #333;
      }
      #seg-nav {
        display: none;
        align-items: center;
        gap: 6px;
        font-size: 0.9em;
      }
      #seg-nav button {
        padding: 4px 10px;
        font-size: 0.9em;
        background: #455a64;
        color: white;
      }
      #seg-label {
        min-width: 120px;
        text-align: center;
        font-family: monospace;
        font-size: 0.8em;
      }
      #loading-overlay {
        display: none;
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.75);
        align-items: center;
        justify-content: center;
        font-size: 1.3em;
        color: #555;
        z-index: 100;
        pointer-events: none;
      }
      #igv-wrapper {
        position: relative;
        flex: 1;
        overflow: hidden;
      }
      #layout-panel {
        padding: 4px 8px;
        background: #fafafa;
        border-top: 1px solid #e0e0e0;
        display: none;
        flex-direction: column;
        gap: 2px;
      }
      .layout-header {
        display: flex;
        font-size: 0.7em;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .layout-header-spacer {
        width: 52px;
        flex-shrink: 0;
      }
      .layout-header-read, .layout-header-genomic {
        flex: 1;
        padding: 0 8px;
      }
      .layout-header-read {
        border-right: 1px solid #e0e0e0;
      }
      .layout-row {
        display: flex;
        align-items: center;
        gap: 0;
        font-size: 0.75em;
        color: #555;
      }
      .layout-label {
        width: 52px;
        flex-shrink: 0;
        font-weight: bold;
        font-size: 0.9em;
      }
      .layout-read-wrap, .layout-genomic-wrap {
        flex: 1;
        min-width: 0;
        padding: 0 8px;
        overflow: visible;
      }
      .layout-read-wrap {
        border-right: 1px solid #e0e0e0;
        align-self: stretch;
      }
      .layout-svg-wrap { flex: 1; overflow: visible; }
      .layout-seg {
        cursor: pointer;
      }
      .layout-seg:hover polygon {
        opacity: 0.75;
      }
      .layout-seg text {
        pointer-events: none;
        user-select: text;
      }
      #seg-tooltip {
        display: none;
        position: fixed;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 10px;
        font-size: 0.8em;
        font-family: monospace;
        color: #333;
        box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        pointer-events: auto;
        z-index: 200;
        line-height: 1.6;
        white-space: nowrap;
        user-select: text;
      }
    </style>
  </head>
  <body>
    <div id="header">
      <h1>Parallax Curation</h1>
      <span id="progress"></span>
      <span id="read-info"></span>
    </div>
    <div id="igv-wrapper">
      <div id="igv-container"></div>
      <div id="loading-overlay">Loading&hellip;</div>
    </div>
    <div id="seg-tooltip"></div>
    <div id="layout-panel">
      <div class="layout-header">
        <div class="layout-header-spacer"></div>
        <div class="layout-header-read">read</div>
        <div class="layout-header-genomic">genomic</div>
      </div>
      <div class="layout-row">
        <span class="layout-label" style="color:#2196F3">mm2</span>
        <div class="layout-read-wrap"><svg id="layout-svg-mm2" height="28"></svg></div>
        <div class="layout-genomic-wrap"><svg id="layout-gsvg-mm2" height="28"></svg></div>
      </div>
      <div class="layout-row">
        <span class="layout-label" style="color:#4CAF50">plx</span>
        <div class="layout-read-wrap"><svg id="layout-svg-plx" height="28"></svg></div>
        <div class="layout-genomic-wrap"><svg id="layout-gsvg-plx" height="28"></svg></div>
      </div>
    </div>
    <div id="controls">
      <button id="btn-mm2" onclick="submitVerdict('mm2')">minimap2 correct</button>
      <button id="btn-plx" onclick="submitVerdict('plx')">parallax correct</button>
      <button id="btn-neither" onclick="submitVerdict('neither')">neither</button>
      <button id="btn-skip" onclick="submitVerdict('skip')">skip</button>
      <div id="seg-nav">
        <button onclick="goToSegment(0)" title="Return to first segment">&#8962;</button>
        <button id="seg-prev" onclick="stepSegment(-1)">&#8592;</button>
        <span id="seg-label"></span>
        <button id="seg-next" onclick="stepSegment(+1)">&#8594;</button>
      </div>
      <input id="notes" type="text" placeholder="Notes (optional)" />
    </div>
    <div id="done-banner">All reads curated. Run build_truth_bam.py to generate the truth BAM.</div>

    <script>
      const REFERENCE = __REFERENCE_JSON__;
      let browser = null;
      let currentRead = null;
      let segments = []; // [{chrom, start, end}] — one per distinct locus
      let segIndex = 0;

      // Parse all distinct loci from a fingerprint string.
      // Each segment becomes a padded locus (10% of segment width on each side).
      function parseLoci(fp) {
        if (!fp) return [];
        const loci = [];
        for (const seg of fp.split(";")) {
          const m = seg.match(/^(\S+):(\d+)-(\d+):/);
          if (!m) continue;
          const start = parseInt(m[2]),
            end = parseInt(m[3]);
          const pad = Math.round((end - start) * 0.1);
          loci.push({ chrom: m[1], start: start - pad, end: end + pad });
        }
        return loci;
      }

      // Merge loci on the same chrom only when they overlap or are within MAX_MERGE_GAP bp.
      // Segments further apart are kept as separate navigation stops.
      const MAX_MERGE_GAP = 50000;
      function mergeLoci(loci) {
        const merged = [];
        for (const l of loci) {
          const last = merged[merged.length - 1];
          if (last && last.chrom === l.chrom && l.start <= last.end + MAX_MERGE_GAP) {
            last.start = Math.min(last.start, l.start);
            last.end = Math.max(last.end, l.end);
          } else {
            merged.push({ ...l });
          }
        }
        return merged;
      }

      function locusStr(seg) {
        return `${seg.chrom}:${Math.max(0, seg.start)}-${seg.end}`;
      }

      async function goToSegment(idx) {
        segIndex = Math.max(0, Math.min(idx, segments.length - 1));
        const seg = segments[segIndex];
        document.getElementById("seg-label").textContent = `seg ${segIndex + 1}/${segments.length}  ${seg.chrom}`;
        await browser.search(locusStr(seg));
      }

      async function stepSegment(delta) {
        await goToSegment(segIndex + delta);
      }

      async function loadCurrent() {
        const resp = await fetch("/api/current");
        const data = await resp.json();

        if (data.done) {
          document.getElementById("controls").style.display = "none";
          document.getElementById("igv-container").style.display = "none";
          document.getElementById("done-banner").style.display = "block";
          document.getElementById("progress").textContent = "Done!";
          return;
        }

        currentRead = data.read_name;
        document.getElementById("notes").value = "";
        document.getElementById("progress").textContent = `${data.stats.position + 1} / ${data.stats.total_queue}`;
        document.getElementById("read-info").textContent = currentRead;

        // Build segment list from both fingerprints, merge overlaps
        const raw = [...parseLoci(data.plx_fingerprint), ...parseLoci(data.mm2_fingerprint)];
        // Deduplicate by locus string before merging
        const seen = new Set();
        const deduped = raw.filter((l) => {
          const k = locusStr(l);
          if (seen.has(k)) return false;
          seen.add(k);
          return true;
        });
        deduped.sort((a, b) => (a.chrom < b.chrom ? -1 : a.chrom > b.chrom ? 1 : a.start - b.start));
        segments = mergeLoci(deduped);
        segIndex = 0;

        // Always show the nav (for the home button); show arrows only with multiple segments
        const nav = document.getElementById("seg-nav");
        nav.style.display = "flex";
        const multi = segments.length > 1;
        document.getElementById("seg-prev").style.display = multi ? "" : "none";
        document.getElementById("seg-next").style.display = multi ? "" : "none";
        document.getElementById("seg-label").style.display = multi ? "" : "none";

        const tracks = [
          {
            name: "minimap2",
            url: data.tracks.mm2_full,
            indexURL: data.tracks.mm2_full + ".bai",
            format: "bam",
            color: "#2196F3",
            height: 200,
            visibilityWindow: -1,
          },
          {
            name: "parallax",
            url: data.tracks.plx_full,
            indexURL: data.tracks.plx_full + ".bai",
            format: "bam",
            color: "#4CAF50",
            height: 200,
            visibilityWindow: -1,
          },
          {
            name: "parallax (this read)",
            url: data.tracks.plx_read,
            indexURL: data.tracks.plx_read + ".bai",
            format: "bam",
            color: "#FF9800",
            height: 100,
            visibilityWindow: -1,
          },
        ];
        if (data.tracks.plx_seeds) {
          tracks.push({
            name: "seeds (this read)",
            url: data.tracks.plx_seeds,
            indexURL: data.tracks.plx_seeds + ".bai",
            format: "bam",
            color: "#9C27B0",
            height: 150,
            visibilityWindow: -1,
          });
        }
        for (const t of data.extra_tracks || []) {
          tracks.push({ visibilityWindow: -1, ...t, name: t.name || t.url.split("/").pop() });
        }

        if (!browser) {
          const options = {
            reference: REFERENCE,
            locus: locusStr(segments[0]),
            tracks: tracks,
            showSVGButton: false,
            search: false,
            blat: false,
          };
          browser = await igv.createBrowser(document.getElementById("igv-container"), options);
        } else {
          const existing = browser.trackViews.map((tv) => tv.track).filter((t) => t.type !== "sequence" && t.id !== "ruler");
          for (const t of existing) {
            await browser.removeTrack(t);
          }
          for (const t of tracks) {
            await browser.loadTrack(t);
          }
        }
        await goToSegment(0);
        renderLayout(data.plx_fingerprint, data.mm2_fingerprint);
        setLoading(false);
      }

      // ── Read layout panel ───────────────────────────────────────────────────

      const LABEL_GAP = 50;      // bp: show numeric length on gaps/clips >= this
      const LAYOUT_ROW_H = 60;   // shared SVG height for read and genomic rows

      // Parse fingerprint into segments sorted by read (query) order.
      // Returns { segs, readLen } where segs are [{chrom,refStart,refEnd,strand,qStart,qEnd,locusKey}]
      function parseFp(fp) {
        if (!fp) return { segs: [], readLen: 0 };
        const segs = [];
        for (const part of fp.split(';')) {
          const m = part.match(/^(\S+):(\d+)-(\d+):([+-]):(\d+)-(\d+)$/);
          if (!m) continue;
          segs.push({
            chrom: m[1], refStart: +m[2], refEnd: +m[3],
            strand: m[4], qStart: +m[5], qEnd: +m[6],
            locusKey: `${m[1]}:${m[2]}-${m[3]}`,
          });
        }
        segs.sort((a, b) => a.qStart - b.qStart);
        const readLen = segs.length ? segs[segs.length - 1].qEnd : 0;
        return { segs, readLen };
      }

      // Build a map from locusKey -> index in the global `segments` array
      // so clicking a layout box navigates to the right IGV stop.
      function buildLocusIndex() {
        const idx = {};
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          // key format matches locusStr but without padding — match on chrom only as fallback
          idx[`${s.chrom}:${s.start}-${s.end}`] = i;
        }
        return idx;
      }

      // Find the IGV segment index that best contains a layout segment.
      function findIgvIdx(seg, locusIdx) {
        // Try each IGV segment: find the one whose chrom matches and whose
        // range overlaps the segment's reference range.
        for (let i = 0; i < segments.length; i++) {
          const s = segments[i];
          if (s.chrom === seg.chrom && s.start <= seg.refEnd && s.end >= seg.refStart) return i;
        }
        return 0;
      }

      // Darken/lighten a hex colour by a factor (-1..1, negative = darker).
      function shadeColor(hex, factor) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.min(255, Math.max(0, Math.round(((n >> 16) & 0xff) * (1 + factor))));
        const g = Math.min(255, Math.max(0, Math.round(((n >>  8) & 0xff) * (1 + factor))));
        const b = Math.min(255, Math.max(0, Math.round(( n        & 0xff) * (1 + factor))));
        return `#${((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}`;
      }

      // Measure text width by temporarily rendering into the SVG.
      function measureText(svgEl, text, fontSize, fontFamily) {
        const ns = 'http://www.w3.org/2000/svg';
        const t = document.createElementNS(ns, 'text');
        t.setAttribute('font-size', fontSize);
        t.setAttribute('font-family', fontFamily);
        t.setAttribute('visibility', 'hidden');
        t.textContent = text;
        svgEl.appendChild(t);
        const w = t.getComputedTextLength();
        svgEl.removeChild(t);
        return w;
      }

      function renderLayoutRow(svgEl, segs, readLen, color) {
        while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
        if (!segs.length) return;

        const ns = 'http://www.w3.org/2000/svg';
        const H = 20, Y = (LAYOUT_ROW_H - H) / 2;  // vertically centred
        const ARROW = 8;             // arrowhead depth (px)
        const PAD = 6;               // horizontal text padding inside box
        const GAP_LINE = 16;         // thin gap connector width (px)
        const GAP_LABEL_W = 36;      // extra gap width when showing a label
        const CLIP_W = 10;           // whisker width (px)
        const CLIP_LABEL_W = 28;     // extra clip width when showing a label
        const FONT_SIZE = '9';
        const FONT_FAMILY = 'monospace';

        const leftClip  = segs[0].qStart;
        const rightClip = readLen > 0 ? readLen - segs[segs.length - 1].qEnd : 0;
        const gaps = [];
        for (let i = 1; i < segs.length; i++) gaps.push(segs[i].qStart - segs[i - 1].qEnd);

        // Build label strings and measure natural text widths
        const labels = segs.map(seg => {
          const locus = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;
          const len = (seg.refEnd - seg.refStart).toLocaleString();
          return { locus, full: locus };
        });
        const textWidths = labels.map(l => measureText(svgEl, l.full, FONT_SIZE, FONT_FAMILY));

        // Box width = text width + padding + arrowhead
        const boxWidths = textWidths.map(tw => tw + PAD * 2 + ARROW);

        function bpLabel(bp) {
          return bp >= 1000 ? `${(bp / 1000).toFixed(1)}k` : `${bp}`;
        }

        // Build item list
        const items = [];
        if (leftClip > 0)
          items.push({ type: 'clip', bp: leftClip, side: 'left',
                       w: CLIP_W + (leftClip >= LABEL_GAP ? CLIP_LABEL_W : 0) });
        for (let i = 0; i < segs.length; i++) {
          items.push({ type: 'seg', seg: segs[i], label: labels[i], w: boxWidths[i] });
          if (i < segs.length - 1)
            items.push({ type: 'gap', bp: gaps[i],
                         w: GAP_LINE + (gaps[i] >= LABEL_GAP ? GAP_LABEL_W : 0) });
        }
        if (rightClip > 0)
          items.push({ type: 'clip', bp: rightClip, side: 'right',
                       w: CLIP_W + (rightClip >= LABEL_GAP ? CLIP_LABEL_W : 0) });

        let x = 0;
        for (const item of items) {
          const midY = Y + H / 2;

          if (item.type === 'clip') {
            const cw = item.w;
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', x); line.setAttribute('x2', x + cw);
            line.setAttribute('y1', midY); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#aaa'); line.setAttribute('stroke-width', 1.5);
            svgEl.appendChild(line);
            if (item.bp >= LABEL_GAP) {
              const t = document.createElementNS(ns, 'text');
              t.setAttribute('x', x + cw / 2); t.setAttribute('y', Y + H + 9);
              t.setAttribute('text-anchor', 'middle');
              t.setAttribute('font-size', '8'); t.setAttribute('fill', '#999');
              t.textContent = bpLabel(item.bp);
              svgEl.appendChild(t);
            }
            x += cw;

          } else if (item.type === 'gap') {
            if (item.bp <= 0) continue;
            const gw = item.w;
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', x); line.setAttribute('x2', x + gw);
            line.setAttribute('y1', midY); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#bbb'); line.setAttribute('stroke-width', 1);
            svgEl.appendChild(line);
            if (item.bp >= LABEL_GAP) {
              const t = document.createElementNS(ns, 'text');
              t.setAttribute('x', x + gw / 2); t.setAttribute('y', midY - 4);
              t.setAttribute('text-anchor', 'middle');
              t.setAttribute('font-size', '8'); t.setAttribute('fill', '#aaa');
              t.textContent = bpLabel(item.bp);
              svgEl.appendChild(t);
            }
            x += gw;

          } else { // seg
            const seg = item.seg;
            const w = item.w;
            const fwd = seg.strand === '+';
            const igvIdx = findIgvIdx(seg, {});

            const g = document.createElementNS(ns, 'g');
            g.setAttribute('class', 'layout-seg');

            const x0 = x, x1 = x + w, ya = Y, yb = Y + H;
            const aw = ARROW;
            let pts;
            if (fwd) {
              pts = [[x0,ya],[x1-aw,ya],[x1,midY],[x1-aw,yb],[x0,yb]];
            } else {
              pts = [[x0+aw,ya],[x1,ya],[x1,yb],[x0+aw,yb],[x0,midY]];
            }
            const poly = document.createElementNS(ns, 'polygon');
            poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
            poly.setAttribute('fill', color);
            poly.setAttribute('stroke', shadeColor(color, -0.3));
            poly.setAttribute('stroke-width', '1');
            svgEl.appendChild(poly);
            g.appendChild(poly);

            const t = document.createElementNS(ns, 'text');
            t.setAttribute('x', fwd ? x0 + PAD : x0 + aw + PAD);
            t.setAttribute('y', midY + 4);
            t.setAttribute('font-size', FONT_SIZE);
            t.setAttribute('font-family', FONT_FAMILY);
            t.setAttribute('fill', 'white');
            t.textContent = item.label.full;
            g.appendChild(t);

            // Drag-aware click: only navigate if mouse hasn't moved significantly
            let mouseDownPos = null;
            g.addEventListener('mousedown', e => { mouseDownPos = { x: e.clientX, y: e.clientY }; });
            g.addEventListener('click', e => {
              if (!mouseDownPos) return;
              const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
              mouseDownPos = null;
              if (Math.sqrt(dx*dx + dy*dy) < 5) goToSegment(igvIdx);
            });

            // Hover tooltip — positioned on entry, stays still so text is selectable
            const tooltip = document.getElementById('seg-tooltip');
            const refLen = (seg.refEnd - seg.refStart).toLocaleString();
            const qLen   = (seg.qEnd - seg.qStart).toLocaleString();
            const strand = seg.strand === '+' ? '(+)' : '(−)';
            const tooltipHTML =
              `<b>${item.label.locus} ${strand}</b><br>` +
              `ref length: ${refLen} bp<br>` +
              `read: ${seg.qStart.toLocaleString()}–${seg.qEnd.toLocaleString()}<br>` +
              `read length: ${qLen} bp`;
            let showTimer = null;
            g.addEventListener('mouseenter', e => {
              showTimer = setTimeout(() => {
                tooltip.innerHTML = tooltipHTML;
                tooltip.style.left = (e.clientX + 14) + 'px';
                tooltip.style.top  = (e.clientY + 14) + 'px';
                tooltip.style.display = 'block';
              }, 300);
            });
            g.addEventListener('mouseleave', e => {
              clearTimeout(showTimer);
              // Delay hide so mouse can move onto the tooltip without it vanishing
              setTimeout(() => {
                if (!tooltip.matches(':hover')) tooltip.style.display = 'none';
              }, 100);
            });

            g.setAttribute('data-locus', item.label.locus);
            svgEl.appendChild(g);
            x += w;
          }
        }

        svgEl.setAttribute('width', x);
        svgEl.setAttribute('viewBox', `0 0 ${x} ${LAYOUT_ROW_H}`);
        svgEl.setAttribute('height', LAYOUT_ROW_H);
      }

      // ── Genomic layout panel ────────────────────────────────────────────────

      // Chromosome sort order: chr1..22, chrX, chrY, then everything else.
      function chromOrder(chrom) {
        const s = chrom.replace(/^chr/i, '');
        if (s === 'X') return 23;
        if (s === 'Y') return 24;
        const n = parseInt(s);
        return isNaN(n) ? 99 : n;
      }

      function renderGenomicRow(svgEl, segs, color) {
        while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);
        if (!segs.length) return;

        const ns = 'http://www.w3.org/2000/svg';
        const H = 20, Y = (LAYOUT_ROW_H - H) / 2;  // box placement, centred in row
        const ARC_H = 28;              // arc peak height above/below box edges
        const ARROW = 8;
        const PAD = 6;
        const CHROM_GAP = 20;          // px between chromosome groups
        const SEG_GAP = 12;            // px between segments on the same chrom
        const FONT_SIZE = '9';
        const FONT_FAMILY = 'monospace';
        const ARROWHEAD = 5;           // arrowhead size on connectors

        // Sort segments by genomic position (chrom order, then refStart).
        // Keep a parallel array of read-order indices so we can draw arrows in read order.
        const genomicOrder = segs
          .map((seg, readIdx) => ({ seg, readIdx }))
          .sort((a, b) => {
            const dc = chromOrder(a.seg.chrom) - chromOrder(b.seg.chrom);
            return dc !== 0 ? dc : a.seg.refStart - b.seg.refStart;
          });

        // Measure box widths
        const boxWidths = genomicOrder.map(({ seg }) => {
          const label = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;
          return measureText(svgEl, label, FONT_SIZE, FONT_FAMILY) + PAD * 2 + ARROW;
        });

        // Assign x positions, grouping by chromosome
        const positions = [];  // x centre of each box (genomicOrder index)
        let x = 0;
        let prevChrom = null;
        for (let i = 0; i < genomicOrder.length; i++) {
          const chrom = genomicOrder[i].seg.chrom;
          if (prevChrom !== null) x += chrom === prevChrom ? SEG_GAP : CHROM_GAP;
          positions.push(x);
          x += boxWidths[i];
          prevChrom = chrom;
        }
        const totalW = x;

        // Build lookup: readIdx -> genomic position index
        const readToGenomic = {};
        genomicOrder.forEach(({ readIdx }, gi) => { readToGenomic[readIdx] = gi; });

        // Draw boxes
        const midY = Y + H / 2;
        for (let gi = 0; gi < genomicOrder.length; gi++) {
          const { seg, readIdx } = genomicOrder[gi];
          const bx = positions[gi];
          const bw = boxWidths[gi];
          const fwd = seg.strand === '+';
          const igvIdx = findIgvIdx(seg, {});
          const label = `${seg.chrom}:${seg.refStart}-${seg.refEnd}`;

          const g = document.createElementNS(ns, 'g');
          g.setAttribute('class', 'layout-seg');

          const x0 = bx, x1 = bx + bw, ya = Y, yb = Y + H, aw = ARROW;
          const pts = fwd
            ? [[x0,ya],[x1-aw,ya],[x1,midY],[x1-aw,yb],[x0,yb]]
            : [[x0+aw,ya],[x1,ya],[x1,yb],[x0+aw,yb],[x0,midY]];
          const poly = document.createElementNS(ns, 'polygon');
          poly.setAttribute('points', pts.map(p => p.join(',')).join(' '));
          poly.setAttribute('fill', color);
          poly.setAttribute('stroke', shadeColor(color, -0.3));
          poly.setAttribute('stroke-width', '1');
          g.appendChild(poly);

          const t = document.createElementNS(ns, 'text');
          t.setAttribute('x', fwd ? x0 + PAD : x0 + aw + PAD);
          t.setAttribute('y', midY + 4);
          t.setAttribute('font-size', FONT_SIZE);
          t.setAttribute('font-family', FONT_FAMILY);
          t.setAttribute('fill', 'white');
          t.textContent = label;
          g.appendChild(t);


          let mouseDownPos = null;
          g.addEventListener('mousedown', e => { mouseDownPos = { x: e.clientX, y: e.clientY }; });
          g.addEventListener('click', e => {
            if (!mouseDownPos) return;
            const dx = e.clientX - mouseDownPos.x, dy = e.clientY - mouseDownPos.y;
            mouseDownPos = null;
            if (Math.sqrt(dx*dx + dy*dy) < 5) goToSegment(igvIdx);
          });

          const tooltip = document.getElementById('seg-tooltip');
          const refLen = (seg.refEnd - seg.refStart).toLocaleString();
          const qLen   = (seg.qEnd - seg.qStart).toLocaleString();
          const strand = seg.strand === '+' ? '(+)' : '(−)';
          const tooltipHTML =
            `<b>${label} ${strand}</b><br>` +
            `ref length: ${refLen} bp<br>` +
            `read: ${seg.qStart.toLocaleString()}–${seg.qEnd.toLocaleString()}<br>` +
            `read length: ${qLen} bp`;
          let showTimer = null;
          g.addEventListener('mouseenter', e => {
            showTimer = setTimeout(() => {
              tooltip.innerHTML = tooltipHTML;
              tooltip.style.left = (e.clientX + 14) + 'px';
              tooltip.style.top  = (e.clientY + 14) + 'px';
              tooltip.style.display = 'block';
            }, 300);
          });
          g.addEventListener('mouseleave', () => {
            clearTimeout(showTimer);
            setTimeout(() => { if (!tooltip.matches(':hover')) tooltip.style.display = 'none'; }, 100);
          });

          svgEl.appendChild(g);
        }

        // Draw connectors between consecutive read-order segments.
        // Arc exits the read-order end of the source box and enters the
        // read-order start of the destination box.
        for (let ri = 0; ri < segs.length - 1; ri++) {
          const fromGi  = readToGenomic[ri];
          const toGi    = readToGenomic[ri + 1];
          const fromSeg = genomicOrder[fromGi].seg;
          const toSeg   = genomicOrder[toGi].seg;

          // Read exits at the tip of the arrowhead polygon:
          //   forward (+): right edge (x + w)
          //   reverse (-): left edge  (x)
          const ax1 = fromSeg.strand === '+' ? positions[fromGi] + boxWidths[fromGi] : positions[fromGi];
          const ax2 = toSeg.strand   === '+' ? positions[toGi]                        : positions[toGi] + boxWidths[toGi];

          // Straight connector when the genomic positions are already adjacent
          // left-to-right and same chrom+strand (read flows naturally forward).
          const straightOk = fromGi < toGi &&
                             Math.abs(fromGi - toGi) === 1 &&
                             fromSeg.chrom === toSeg.chrom &&
                             fromSeg.strand === '+' && toSeg.strand === '+';

          if (straightOk) {
            const line = document.createElementNS(ns, 'line');
            line.setAttribute('x1', ax1); line.setAttribute('y1', midY);
            line.setAttribute('x2', ax2 - ARROWHEAD); line.setAttribute('y2', midY);
            line.setAttribute('stroke', '#888'); line.setAttribute('stroke-width', 1);
            svgEl.appendChild(line);
            const ah = document.createElementNS(ns, 'polygon');
            ah.setAttribute('points', `${ax2},${midY} ${ax2-ARROWHEAD},${midY-3} ${ax2-ARROWHEAD},${midY+3}`);
            ah.setAttribute('fill', '#888');
            svgEl.appendChild(ah);
          } else {
            // Alternate arcs above/below to reduce overlap clutter.
            const above = ri % 2 === 0;
            const cp = above ? Y - ARC_H : Y + H + ARC_H;  // bezier control point y
            const endY = midY;                               // endpoints at vertical centre
            const mx = (ax1 + ax2) / 2;
            const path = document.createElementNS(ns, 'path');
            path.setAttribute('d', `M ${ax1} ${endY} Q ${mx} ${cp} ${ax2} ${endY}`);
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke', '#888');
            path.setAttribute('stroke-width', 1);
            svgEl.appendChild(path);
            // Arrowhead tangent to arc at destination.
            // Tangent direction at end of quadratic bezier: (end - control)
            const tdx = ax2 - mx, tdy = endY - cp;
            const tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
            const ux = tdx/tlen, uy = tdy/tlen;
            const tip = [ax2, endY];
            const b1  = [ax2 - ux*ARROWHEAD - uy*3, endY - uy*ARROWHEAD + ux*3];
            const b2  = [ax2 - ux*ARROWHEAD + uy*3, endY - uy*ARROWHEAD - ux*3];
            const ah = document.createElementNS(ns, 'polygon');
            ah.setAttribute('points', `${tip[0]},${tip[1]} ${b1[0]},${b1[1]} ${b2[0]},${b2[1]}`);
            ah.setAttribute('fill', '#888');
            svgEl.appendChild(ah);
          }
        }

        // Boxes are centred at Y in [0, LAYOUT_ROW_H]. Arcs extend ARC_H beyond box edges.
        // Shift viewBox up so upward arcs (Y - ARC_H) are not clipped; keep height fixed.
        const vbTop = Y - ARC_H;
        svgEl.setAttribute('width', totalW);
        svgEl.setAttribute('viewBox', `0 ${vbTop} ${totalW} ${LAYOUT_ROW_H}`);
        svgEl.setAttribute('height', LAYOUT_ROW_H);
      }

      function renderLayout(plxFp, mm2Fp) {
        const { segs: plxSegs, readLen: plxLen } = parseFp(plxFp);
        const { segs: mm2Segs, readLen: mm2Len } = parseFp(mm2Fp);

        const panel = document.getElementById('layout-panel');
        if (!plxSegs.length && !mm2Segs.length) { panel.style.display = 'none'; return; }
        panel.style.display = 'flex';

        renderLayoutRow(document.getElementById('layout-svg-mm2'), mm2Segs, mm2Len, '#2196F3');
        renderLayoutRow(document.getElementById('layout-svg-plx'), plxSegs, plxLen, '#4CAF50');
        renderGenomicRow(document.getElementById('layout-gsvg-mm2'), mm2Segs, '#2196F3');
        renderGenomicRow(document.getElementById('layout-gsvg-plx'), plxSegs, '#4CAF50');
      }

      function setLoading(on) {
        const overlay = document.getElementById("loading-overlay");
        overlay.style.display = on ? "flex" : "none";
        for (const id of ["btn-mm2", "btn-plx", "btn-neither", "btn-skip"]) document.getElementById(id).disabled = on;
      }

      async function submitVerdict(verdict) {
        if (!currentRead) return;
        setLoading(true);
        const notes = document.getElementById("notes").value.trim();
        await fetch("/api/verdict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ read_name: currentRead, verdict, notes }),
        });
        loadCurrent();
      }

      // Keyboard shortcuts
      document.addEventListener("keydown", (e) => {
        if (e.target.id === "notes") return;
        if (e.key === "1") submitVerdict("mm2");
        if (e.key === "2") submitVerdict("plx");
        if (e.key === "3") submitVerdict("neither");
        if (e.key === "4") submitVerdict("skip");
        if (e.key === "ArrowLeft") stepSegment(-1);
        if (e.key === "ArrowRight") stepSegment(+1);
      });

      document.getElementById('seg-tooltip').addEventListener('mouseleave', () => {
        document.getElementById('seg-tooltip').style.display = 'none';
      });

      loadCurrent();
    </script>
  </body>
</html>
