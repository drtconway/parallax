[package]
name = "parallax"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "57.3.0"
bitvec = "1.0.1"
# Note: only enable ONE simd feature for your platform
# - simd_neon for Apple Silicon (M1/M2/M3)
# - simd_avx2 for modern Intel/AMD (x86_64)
# - simd_sse2 for older x86_64
# - simd_wasm for WebAssembly
block-aligner = { version = "0.5.1", features = ["simd_avx2"] }
cactus = "1.0.7"
clap = { version = "4.5.57", features = ["derive"] }
confique = { version = "0.4.0", features = ["toml"] }
crossbeam = "0.8.4"
env_logger = "0.11.8"
log = "0.4.29"
metrics = "0.24.3"
metrics-util = "0.20.1"
niffler = "3.0.0"
noodles = { version = "0.104.0", features = ["core", "bam", "bed", "cram", "fasta", "fastq", "sam", "bgzf"] }
ordered-float = "5.1.0"
parquet = "57.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
suffix = "1.3.0"
tracing = "0.1.44"
zip = { version = "7.4.0", features = [] }

[dev-dependencies]
rand = "0.10.0"
tempfile = "3.25.0"
