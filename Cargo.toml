[package]
name = "parallax"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "57.2.0"
bitvec = "1.0.1"
clap = { version = "4.5.54", features = ["derive"] }
confique = { version = "0.4.0", features = ["toml"] }
crossbeam = "0.8.4"
env_logger = "0.11.8"
log = "0.4.29"
metrics = "0.24.3"
metrics-util = "0.20.1"
niffler = "3.0.0"
noodles = { version = "0.104.0", features = ["core", "bam", "bed", "cram", "fasta", "fastq", "sam", "bgzf"] }
ordered-float = "5.1.0"
parquet = "57.2.0"
rand = "0.9.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.24.0"
