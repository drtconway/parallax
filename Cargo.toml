[package]
edition = "2024"
name = "parallax"
version = "0.2.0"

[features]
default = ["explanatory"]
attic = []
wfa2 = ["biodiff-wfa2-sys"]
# Alignment construction algorithm — exactly one should be enabled at a time.
explanatory = []

[dependencies]
arrow = "59.0.0"
bitvec = "1.1.1"
# Note: only enable ONE simd feature for your platform
# - simd_neon for Apple Silicon (M1/M2/M3)
# - simd_avx2 for modern Intel/AMD (x86_64)
# - simd_sse2 for older x86_64
# - simd_wasm for WebAssembly
biodiff-wfa2-sys = {version = "2.3.5", features = ["bundle-wfa2"], optional = true}
block-aligner = {version = "0.5.1", features = ["simd_avx2"]}
cactus = "1.0.7"
clap = {version = "4.6.1", features = ["derive"]}
confique = {version = "0.4.0", features = ["toml"]}
crossbeam = "0.8.4"
env_logger = "0.11.11"
log = "0.4.33"
niffler = "3.0.1"
noodles = {version = "0.111.0", features = ["core", "bam", "bed", "cram", "fasta", "fastq", "sam", "bgzf", "vcf"]}
num-traits = "0.2.19"
ordered-float = "5.3.0"
parquet = "59.0.0"
rand = "0.10.1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0.150"
suffix = "1.3.0"
tracing = "0.1.44"
zip = {version = "8.6.0", features = []}
chrono = "0.4.45"
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
debug = "line-tables-only"
